services:
    app:
        image: exertion-app:${VERSION:-latest}
        container_name: exertion-app
        restart: unless-stopped
        working_dir: /var/www/html
        environment:
            - APP_ENV=production
            - APP_DEBUG=false
            - LOG_CHANNEL=stderr
            - DB_HOST=database
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - REDIS_HOST=redis
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        depends_on:
            - database
            - redis
        networks:
            - exertion_network
        healthcheck:
            test: ["CMD", "php-fpm-healthcheck"]
            interval: 30s
            timeout: 10s
            retries: 3
        deploy:
            resources:
                limits:
                    memory: 512M
                reservations:
                    memory: 256M

    webserver:
        image: exertion-nginx:${VERSION:-latest}
        container_name: exertion-nginx
        restart: unless-stopped
        ports:
            - "${HTTP_PORT:-80}:8080"
            - "${HTTPS_PORT:-443}:8443"
        depends_on:
            - app
        networks:
            - exertion_network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080"]
            interval: 30s
            timeout: 10s
            retries: 3
        deploy:
            resources:
                limits:
                    memory: 128M
                reservations:
                    memory: 64M

    database:
        image: mysql:8.0
        container_name: exertion-mysql
        restart: unless-stopped
        environment:
            - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
            - MYSQL_DATABASE=${DB_DATABASE}
            - MYSQL_USER=${DB_USERNAME}
            - MYSQL_PASSWORD=${DB_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - exertion_network
        command: --default-authentication-plugin=mysql_native_password
        deploy:
            resources:
                limits:
                    memory: 1G
                reservations:
                    memory: 512M

    redis:
        image: redis:7-alpine
        container_name: exertion-redis
        restart: unless-stopped
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD}
        volumes:
            - redis_data:/data
        networks:
            - exertion_network
        command: redis-server --requirepass ${REDIS_PASSWORD}
        deploy:
            resources:
                limits:
                    memory: 256M
                reservations:
                    memory: 128M

volumes:
    mysql_data:
        driver: local
    redis_data:
        driver: local

networks:
    exertion_network:
        driver: bridge
