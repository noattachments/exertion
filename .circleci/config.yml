version: 2.1

# Define reusable orbs
orbs:
  docker: circleci/docker@2.6.0
  node: circleci/node@5.1.0
  php: circleci/php@2.0.0

# Define reusable commands
commands:
  setup-docker-compose:
    description: "Setup Docker Compose for testing"
    steps:
      - run:
          name: "Install Docker Compose"
          command: |
            sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            docker-compose --version

  wait-for-services:
    description: "Wait for services to be ready"
    steps:
      - run:
          name: "Wait for database"
          command: |
            timeout 60 bash -c 'until docker-compose exec -T database mysqladmin ping -h localhost -u root -p${DB_PASSWORD} --silent; do sleep 2; done'
      - run:
          name: "Wait for Redis"
          command: |
            timeout 60 bash -c 'until docker-compose exec -T redis redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG; do sleep 2; done'

  run-laravel-tests:
    description: "Run Laravel PHP tests"
    steps:
      - run:
          name: "Run PHP Tests"
          command: |
            docker-compose exec -T app php artisan test --parallel
          environment:
            APP_ENV: testing
            DB_DATABASE: exertion_test
            DB_USERNAME: exertion_user
            DB_PASSWORD: exertion

  run-javascript-tests:
    description: "Run JavaScript/Node tests"
    steps:
      - run:
          name: "Run JavaScript Tests"
          command: |
            docker-compose exec -T app npm test

  security-scan:
    description: "Run security and code quality scans"
    steps:
      - run:
          name: "PHP Security Scan"
          command: |
            docker-compose exec -T app composer audit
      - run:
          name: "Node Security Scan"
          command: |
            docker-compose exec -T app npm audit --audit-level moderate
      - run:
          name: "Docker Image Security Scan"
          command: |
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy image --exit-code 1 --severity HIGH,CRITICAL \
              exertion-app:latest

# Define jobs
jobs:
  # Test job for pull requests and feature branches
  test:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project
    steps:
      - checkout
      
      - setup-docker-compose
      
      - run:
          name: "Set environment variables"
          command: |
            echo 'export VERSION=test-${CIRCLE_SHA1:0:7}' >> $BASH_ENV
            echo 'export GIT_COMMIT=${CIRCLE_SHA1:0:7}' >> $BASH_ENV
            echo 'export DB_PASSWORD=exertion' >> $BASH_ENV
            echo 'export REDIS_PASSWORD=redis' >> $BASH_ENV
            echo 'export DB_DATABASE=exertion_test' >> $BASH_ENV
            echo 'export DB_USERNAME=exertion_user' >> $BASH_ENV
            source $BASH_ENV
      
      - run:
          name: "Build and start services"
          command: |
            make build-local
            make up-local
      
      - wait-for-services
      
      - run:
          name: "Run database migrations"
          command: |
            make migrate
      
      - run-laravel-tests
      
      - run-javascript-tests
      
      - run:
          name: "Generate code coverage"
          command: |
            docker-compose exec -T app php artisan test --coverage --coverage-html=storage/coverage
      
      - run:
          name: "Store test results"
          command: |
            mkdir -p ~/test-results
            docker-compose logs app > ~/test-results/app.log
            docker-compose logs database > ~/test-results/database.log
            docker-compose logs redis > ~/test-results/redis.log
          when: always
      
      - store_test_results:
          path: ~/test-results
          when: always
      
      - store_artifacts:
          path: ~/project/storage/coverage
          destination: coverage
          when: always
      
      - run:
          name: "Cleanup"
          command: |
            make down-local
          when: always

  # Security and code quality job
  security:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project
    steps:
      - checkout
      
      - setup-docker-compose
      
      - run:
          name: "Set environment variables"
          command: |
            echo 'export VERSION=security-${CIRCLE_SHA1:0:7}' >> $BASH_ENV
            echo 'export GIT_COMMIT=${CIRCLE_SHA1:0:7}' >> $BASH_ENV
            echo 'export DB_PASSWORD=exertion' >> $BASH_ENV
            echo 'export REDIS_PASSWORD=redis' >> $BASH_ENV
            source $BASH_ENV
      
      - run:
          name: "Build images for security scan"
          command: |
            make build-local
      
      - security-scan
      
      - run:
          name: "PHP Code Quality"
          command: |
            docker-compose exec -T app ./vendor/bin/pint --test
            docker-compose exec -T app ./vendor/bin/phpstan analyse --memory-limit=2G
      
      - run:
          name: "Cleanup"
          command: |
            make down-local
          when: always

  # Build and push Docker images
  build-and-push:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project
    steps:
      - checkout
      
      - setup-docker-compose
      
      - run:
          name: "Set environment variables"
          command: |
            echo 'export VERSION=${CIRCLE_TAG:-${CIRCLE_SHA1:0:7}}' >> $BASH_ENV
            echo 'export GIT_COMMIT=${CIRCLE_SHA1:0:7}' >> $BASH_ENV
            # Use CIRCLE_PROJECT_USERNAME for Docker Hub, or set DOCKER_REGISTRY env var for other registries
            if [ -n "$DOCKER_REGISTRY" ]; then
              echo "export REGISTRY=$DOCKER_REGISTRY" >> $BASH_ENV
            else
              echo "export REGISTRY=${CIRCLE_PROJECT_USERNAME:-your-registry.com}" >> $BASH_ENV
            fi
            source $BASH_ENV
      
      - docker/check:
          docker-username: DOCKER_USERNAME
          docker-password: DOCKER_PASSWORD
      
      - run:
          name: "Build and push images"
          command: |
            make build-push REGISTRY=${REGISTRY}
      
      - run:
          name: "Update deployment manifests"
          command: |
            # Update image tags in deployment files
            sed -i "s|exertion-app:latest|${REGISTRY}/exertion-app:${VERSION}|g" docker-compose.yml
            sed -i "s|exertion-nginx:latest|${REGISTRY}/exertion-nginx:${VERSION}|g" docker-compose.yml
      
      - run:
          name: "Store deployment artifacts"
          command: |
            mkdir -p ~/deployment
            cp docker-compose.yml ~/deployment/
            cp .env.prod.template ~/deployment/.env.template
            echo "VERSION=${VERSION}" > ~/deployment/version.txt
            echo "GIT_COMMIT=${GIT_COMMIT}" >> ~/deployment/version.txt
      
      - store_artifacts:
          path: ~/deployment
          destination: deployment

  # Deploy to staging environment
  deploy-staging:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project
    steps:
      - checkout
      
      - attach_workspace:
          at: ~/deployment
      
      - run:
          name: "Deploy to staging"
          command: |
            # This would typically deploy to a staging environment
            # For now, we'll just validate the deployment configuration
            echo "Deploying version $(cat ~/deployment/version.txt) to staging"
            echo "Deployment configuration validated successfully"
      
      - run:
          name: "Run smoke tests"
          command: |
            # Add smoke tests here
            echo "Smoke tests would run here"

  # Deploy to production
  deploy-production:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project
    steps:
      - checkout
      
      - attach_workspace:
          at: ~/deployment
      
      - run:
          name: "Deploy to production"
          command: |
            # This would typically deploy to production
            # For now, we'll just validate the deployment configuration
            echo "Deploying version $(cat ~/deployment/version.txt) to production"
            echo "Production deployment configuration validated successfully"
      
      - run:
          name: "Run production health checks"
          command: |
            # Add production health checks here
            echo "Production health checks would run here"

# Define workflows
workflows:
  # Main workflow for feature branches and pull requests
  test-and-security:
    jobs:
      - test:
          filters:
            branches:
              ignore: main
      - security:
          filters:
            branches:
              ignore: main

  # Build and deploy workflow for main branch
  build-and-deploy:
    jobs:
      - test:
          filters:
            branches:
              only: main
      - security:
          filters:
            branches:
              only: main
      - build-and-push:
          requires:
            - test
            - security
          filters:
            branches:
              only: main
      - deploy-staging:
          requires:
            - build-and-push
          filters:
            branches:
              only: main
      - deploy-production:
          requires:
            - deploy-staging
          filters:
            branches:
              only: main
            tags:
              only: /^v\d+\.\d+\.\d+$/

  # Tag-based deployment workflow
  tag-deployment:
    jobs:
      - build-and-push:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - deploy-production:
          requires:
            - build-and-push
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/

# Environment variables (set in CircleCI project settings)
# Required environment variables:
# - DOCKER_USERNAME: Docker Hub username
# - DOCKER_PASSWORD: Docker Hub password or access token
# - DB_PASSWORD: Database password for testing
# - REDIS_PASSWORD: Redis password for testing
