services:
    app:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile
            tags:
                - exertion-app:${VERSION:-latest}
                - exertion-app:${GIT_COMMIT:-latest}
        container_name: exertion-app-local
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - ./storage/logs:/var/www/html/storage/logs
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
            - LOG_CHANNEL=stderr
            - DB_HOST=database
            - DB_DATABASE=${DB_DATABASE:-exertion}
            - DB_USERNAME=${DB_USERNAME:-app}
            - DB_PASSWORD=${DB_PASSWORD:-exertion}
            - REDIS_HOST=redis
            - REDIS_PASSWORD=redis
        depends_on:
            - database
            - redis
        networks:
            - exertion_network
        healthcheck:
            test: ["CMD", "php-fpm-healthcheck"]
            interval: 30s
            timeout: 10s
            retries: 3

    webserver:
        build:
            context: .
            dockerfile: .docker/nginx/Dockerfile
            tags:
                - exertion-nginx:${VERSION:-latest}
                - exertion-nginx:${GIT_COMMIT:-latest}
        container_name: exertion-nginx-local
        restart: unless-stopped
        ports:
            - "8080:8080"
        volumes:
            - .:/var/www/html
            - ./storage/logs:/var/www/html/storage/logs
        depends_on:
            - app
        networks:
            - exertion_network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080"]
            interval: 30s
            timeout: 10s
            retries: 3

    database:
        build:
            context: .
            dockerfile: .docker/mysql/Dockerfile
        container_name: exertion-mysql-local
        restart: unless-stopped
        environment:
            - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root}
            - MYSQL_DATABASE=${DB_DATABASE:-exertion}
            - MYSQL_USER=${DB_USERNAME:-app}
            - MYSQL_PASSWORD=${DB_PASSWORD:-exertion}
        volumes:
            - mysql_data:/var/lib/mysql
        ports:
            - "3306:3306"
        networks:
            - exertion_network
        command: --default-authentication-plugin=mysql_native_password

    redis:
        build:
            context: .
            dockerfile: .docker/redis/Dockerfile
        container_name: exertion-redis-local
        restart: unless-stopped
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD:-redis}
        volumes:
            - redis_data:/data
        ports:
            - "6379:6379"
        networks:
            - exertion_network
        command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-redis}

volumes:
    mysql_data:
        driver: local
    redis_data:
        driver: local

networks:
    exertion_network:
        driver: bridge
