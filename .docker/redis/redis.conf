# Redis configuration for production
port 6379
bind 0.0.0.0
protected-mode yes
requirepass redis

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Security
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "CONFIG_b835729c"

# Performance
tcp-keepalive 300
timeout 0