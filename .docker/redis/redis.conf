# Redis configuration file

# ===== NETWORK =====
# Bind to all interfaces to allow container communication
bind 0.0.0.0

# Protected mode - disable for containerized environments
protected-mode no

# Port to listen on
port 6379

# TCP listen backlog
tcp-backlog 511

# Unix socket (disabled for container use)
# unixsocket /tmp/redis.sock
# unixsocketperm 700

# Close connection after client is idle for N seconds (0 to disable)
timeout 0

# TCP keepalive
tcp-keepalive 300

# ===== GENERAL =====
# Run as daemon (disabled for Docker)
daemonize no

# PID file
pidfile /var/run/redis_6379.pid

# Log level: warning, notice, info, debug
loglevel notice

# Log file (log to stdout for Docker)
logfile ""

# Databases
databases 16

# Always show logo
always-show-logo no

# ===== SNAPSHOTTING =====
# Save DB to disk
# Format: save <seconds> <changes>
save 900 1      # 15 minutes if at least 1 key changed
save 300 10     # 5 minutes if at least 10 keys changed
save 60 10000   # 1 minute if at least 10000 keys changed

# Stop writes if save fails
stop-writes-on-bgsave-error yes

# Compress string objects in RDB files
rdbcompression yes

# CRC64 checksum for RDB files
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# RDB file directory
dir /data

# ===== REPLICATION =====
# Master-Replica replication
# replicaof <masterip> <masterport>

# Master password
# masterauth <master-password>

# Replicas stay connected to master during replica-sync
replica-serve-stale-data yes

# Replicas read-only
replica-read-only yes

# Repl diskless sync
repl-diskless-sync no

# Repl diskless sync delay
repl-diskless-sync-delay 5

# Repl ping replica period
repl-ping-replica-period 10

# Repl timeout
repl-timeout 60

# Repl disable TCP_NODELAY
repl-disable-tcp-nodelay no

# Repl backlog size
repl-backlog-size 1mb

# Repl backlog TTL
repl-backlog-ttl 3600

# Replica priority
replica-priority 100

# ===== SECURITY =====
# Require clients to issue AUTH <PASSWORD>
# requirepass your_strong_password_here

# Rename commands for security
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""

# ===== CLIENTS =====
# Maximum number of connected clients
maxclients 10000

# ===== MEMORY MANAGEMENT =====
# Maximum memory limit (0 for no limit)
# maxmemory 512mb

# Memory policy when maxmemory is reached:
# volatile-lru -> remove LRU keys with expire set
# allkeys-lru -> remove any key according to LRU
# volatile-random -> remove random keys with expire set
# allkeys-random -> remove random keys
# volatile-ttl -> remove keys with expire set and shortest TTL
# noeviction -> return errors on write operations
maxmemory-policy noeviction

# LRU sample size
maxmemory-samples 5

# Replica ignore maxmemory
replica-ignore-maxmemory yes

# ===== LAZY FREEING =====
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# ===== APPEND ONLY MODE =====
# AOF persistence
appendonly no

# AOF filename
appendfilename "appendonly.aof"

# AOF fsync policy:
# no: never fsync, let OS flush data
# always: fsync after every write
# everysec: fsync every second
appendfsync everysec

# No fsync on AOF rewrite
no-appendfsync-on-rewrite no

# Auto AOF rewrite percentage
auto-aof-rewrite-percentage 100

# Auto AOF rewrite minimum size
auto-aof-rewrite-min-size 64mb

# AOF load truncated
aof-load-truncated yes

# AOF use RDB preamble
aof-use-rdb-preamble yes

# ===== LUA SCRIPTING =====
# Lua script maximum execution time (ms)
lua-time-limit 5000

# ===== REDIS CLUSTER =====
# Cluster enabled
cluster-enabled no

# Cluster configuration file
cluster-config-file nodes-6379.conf

# Cluster node timeout
cluster-node-timeout 15000

# Cluster replica validity factor
cluster-replica-validity-factor 10

# Cluster migration barrier
cluster-migration-barrier 1

# Cluster require full coverage
cluster-require-full-coverage yes

# ===== SLOW LOG =====
# Slow log threshold (microseconds)
slowlog-log-slower-than 10000

# Slow log maximum length
slowlog-max-len 128

# ===== LATENCY MONITOR =====
latency-monitor-threshold 0

# ===== EVENT NOTIFICATION =====
# notify-keyspace-events ""

# ===== ADVANCED CONFIG =====
# Hash configuration
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List configuration
list-max-ziplist-size -2
list-compress-depth 0

# Set configuration
set-max-intset-entries 512

# Zset configuration
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog configuration
hll-sparse-max-bytes 3000

# Stream configuration
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client query buffers
client-query-buffer-limit 1gb

# Proto-max-bulk-len
proto-max-bulk-len 512mb

# Hz
hz 10

# Dynamic Hz
dynamic-hz yes

# AOF rewrite incremental fsync
aof-rewrite-incremental-fsync yes

# RDB save incremental fsync
rdb-save-incremental-fsync yes

# Laravel-optimized Redis configuration
bind 0.0.0.0
protected-mode no
port 6379
daemonize no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# Persistence - adjust based on your needs
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Memory management - crucial for production
maxmemory 1gb
maxmemory-policy allkeys-lru

# Performance tuning for Laravel workloads
maxclients 10000
timeout 0
tcp-keepalive 300

# Disable AOF for better performance (if you can afford to lose some data)
appendonly no

# Lua scripting
lua-time-limit 5000

# Slow log for debugging
slowlog-log-slower-than 10000
slowlog-max-len 128

# ===== SECURITY =====
# Enable password authentication (highly recommended for production)
requirepass your_very_strong_password_here

# Rename dangerous commands for security
rename-command FLUSHDB "FLUSHDB_SECURED"
rename-command FLUSHALL "FLUSHALL_SECURED"
rename-command CONFIG "CONFIG_SECURED"
rename-command SHUTDOWN "SHUTDOWN_SECURED"

# Client timeouts
timeout 300

# Maximum number of clients
maxclients 10000
